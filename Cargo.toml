[workspace]
resolver = "2"
members = [
    "crates/meshtree-core",
    "crates/meshtree-platform",
    "crates/meshtree",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
meshtree-core = { path = "crates/meshtree-core" }
meshtree-platform = { path = "crates/meshtree-platform" }
clap = { version = "4", features = ["derive"] }
proptest = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
