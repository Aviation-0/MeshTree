# Release gate called by release.yml before any artifact is built (SPEC §19,
# T-035): a known vulnerability in the dependency tree stops the release.
name: Release audit

on:
  workflow_call:

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock against the RustSec advisory database
        run: cargo audit
